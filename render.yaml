services:
  - type: web
    name: examlens
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/system/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: rapidocr
      - key: PYTHONUNBUFFERED
        value: "1"
