services:
  - type: web
    name: examlens
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/system/status
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: rapidocr
      - key: PYTHONUNBUFFERED
        value: "1"
